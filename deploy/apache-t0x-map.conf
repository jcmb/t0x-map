# Full VirtualHost for t0x-map — only use if this ServerName is NOT already
# defined elsewhere. Prefer apache-t0x-map.location.conf otherwise.
#
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp deploy/apache-t0x-map.conf /etc/apache2/sites-available/t0x-map.conf
#   sudo a2ensite t0x-map
#   sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName gnssplot.eng.trimble.com

    SSLEngine on
    # SSLCertificateFile /etc/ssl/certs/gnssplot.eng.trimble.com.crt
    # SSLCertificateKeyFile /etc/ssl/private/gnssplot.eng.trimble.com.key
    # SSLCertificateChainFile /etc/ssl/certs/gnssplot.eng.trimble.com.chain.crt

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /t0x/ http://127.0.0.1:8787/
    ProxyPassReverse /t0x/ http://127.0.0.1:8787/

    RedirectMatch 308 ^/t0x$ /t0x/

    <Location /t0x/>
        DirectorySlash Off
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Prefix "/t0x"
    </Location>
</VirtualHost>
