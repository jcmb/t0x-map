# Fragment for the existing gnssplot SSL VirtualHost
# (e.g. gnssplot.eng.trimble.com).
#
# BEFORE ProxyPass will work:
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl restart apache2
#
# Install:
#   sudo cp deploy/apache-t0x-map.location.conf /etc/apache2/conf-available/t0x-map.conf
#   sudo a2enconf t0x-map
#   sudo systemctl reload apache2
#
# App config must keep:
#   listen: "127.0.0.1:8787"
#   base_path: ""
#
# Trailing slashes must match on BOTH sides of ProxyPass or browsers
# get redirect loops (often Location: ./).

<IfModule !proxy_module>
    Error "mod_proxy is not loaded. Run: a2enmod proxy proxy_http headers && systemctl restart apache2"
</IfModule>

ProxyRequests Off
ProxyPreserveHost On

# Prefer ProxyPass at vhost scope (not inside <Location>) — clearer slash handling.
ProxyPass        /t0x/ http://127.0.0.1:8787/
ProxyPassReverse /t0x/ http://127.0.0.1:8787/

# Absolute redirect only (never "./")
RedirectMatch 308 ^/t0x$ /t0x/

<Location /t0x/>
    DirectorySlash Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/t0x"
</Location>
